<style>
  .loader {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: inline-block;
    position: relative;
    border: 3px solid;
    border-color: #666 #666 transparent;
    box-sizing: border-box;
    animation: rotation 1s linear infinite;
  }
  .loader::after {
    content: "";
    box-sizing: border-box;
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    margin: auto;
    border: 3px solid;
    border-color: transparent #00bb86 #00bb86;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    animation: rotationBack 0.5s linear infinite;
    transform-origin: center center;
  }

  @keyframes rotation {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }

  @keyframes rotationBack {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(-360deg);
    }
  }
</style>
<div>
  <div class="uk-text-center uk-text-bold uk-text-primary">Checkout</div>
  <h3 class="uk-text-center uk-margin-remove">{subject}</h3>

  <div class="uk-margin-small">{type}</div>

  <table
    class="uk-table uk-table-responsive uk-table-middle uk-table-small uk-table-striped uk-margin-remove-bottom"
  >
    <tr>
      <th>Amount</th>
      <th>Description</th>
      <th class="uk-text-right@m">Price</th>
    </tr>
    <tr>
      <td>{amount}</td>
      <td class="uk-width-expand">
        {subject}
        <div class="uk-text-small uk-text-muted">
          <a href="{back}#pricing">Change Plan</a>
        </div>
      </td>
      <td class="uk-text-nowrap uk-text-right@m">
        <div>
          Net:
          <span
            data-price="{price}"
            id="price"
          ></span>
        </div>
        <div class="uk-text-bold">Gross: <span id="gross"></span></div>
      </td>
    </tr>
  </table>

  <hr class="uk-margin-remove-top" />

  <p class="uk-text-small uk-text-muted tax uk-hidden">
    For your order type we have to apply 20% tax.
  </p>

  <div class="uk-margin">{email}</div>
  <div
    class="individual"
    hidden
  >
    <div class="uk-margin">{forename}</div>
    <div class="uk-margin">{surname}</div>
  </div>
  <div class="company">
    <div class="uk-margin">{company}</div>
    <div class="uk-margin">{vatid}</div>
  </div>
  <div class="uk-margin">{recipient}</div>
  <div class="uk-margin">{country}</div>

  <div>{instant}</div>
  <div>{terms}</div>
</div>

<div
  id="htmx-modal"
  class="uk-modal-container"
  uk-modal
>
  <div class="uk-modal-dialog uk-modal-body uk-margin-auto-vertical">
    <button
      class="uk-modal-close-default"
      type="button"
      uk-close
    ></button>

    <div class="content"></div>
    <div class="loading uk-hidden">
      <div class="uk-flex uk-flex-center uk-section">
        <div uk-spinner></div>
      </div>
    </div>
  </div>
</div>

<script>
  function updatePrice() {
    let util = UIkit.util;
    let amount = util.$("input[name=amount]").value * 1;
    let $net = util.$("#price");
    let EUR = new Intl.NumberFormat("de-DE", {
      style: "currency",
      currency: "EUR",
    });
    let tax = 1;
    // let type = util.$("input[name=type]:checked").value;
    let type = util.$("[name=type]").value;
    if (type === "aut-company" || type === "eu-individual") {
      tax = 1.2;
      util.removeClass(util.$$(".tax"), "uk-hidden");
    } else {
      util.addClass(util.$$(".tax"), "uk-hidden");
    }
    let net = util.data($net, "price") * 1;
    // console.log(amount, $net, price, net);
    $net.innerText = EUR.format(net * amount);
    util.$("#gross").innerText = EUR.format(amount * net * tax);
  }
  function showLoading(e) {
    if (!Nette.validateForm(e.target)) return;
    UIkit.modal.dialog(
      "<div class='uk-padding uk-text-center'>" +
        "<strong>Processing your request ...</strong>" +
        "<div class=uk-margin-top><span class=loader></span></div>" +
        "</div>"
    );
  }
  updatePrice();

  // reset loading spinner for hx-modal
  UIkit.util.on("#htmx-modal", "beforeshow", function (e) {
    let util = UIkit.util;
    let $modal = e.target;
    util.$(".content", $modal).innerHTML = util.$(".loading", $modal).innerHTML;
  });
</script>

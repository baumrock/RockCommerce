<div>
  <div class="uk-text-center uk-text-bold uk-text-primary">Checkout</div>
  <h3 class="uk-text-center uk-margin-remove">{subject}</h3>

  <div class="uk-margin-small">{type}</div>

  <table
    class="uk-table uk-table-responsive uk-table-middle uk-table-small uk-table-striped uk-margin-remove-bottom"
  >
    <tr>
      <th>Amount</th>
      <th>Description</th>
      <th class="uk-text-right@m">Price</th>
    </tr>
    <tr>
      <td>{amount}</td>
      <td class="uk-width-expand">
        {subject}
        <div class="uk-text-small uk-text-muted">
          <a href="{back}#pricing">Change Plan</a>
        </div>
      </td>
      <td class="uk-text-nowrap uk-text-right@m">
        <div>
          Net:
          <span
            data-price="{price}"
            id="price"
          ></span>
        </div>
        <div class="uk-text-bold">Gross: <span id="gross"></span></div>
      </td>
    </tr>
  </table>

  <hr class="uk-margin-remove-top" />

  <p class="uk-text-small uk-text-muted tax uk-hidden">
    For your order type we have to apply 20% tax.
  </p>

  <div class="uk-margin">{email}</div>
  <div
    class="individual"
    hidden
  >
    <div class="uk-margin">{forename}</div>
    <div class="uk-margin">{surname}</div>
  </div>
  <div class="company">
    <div class="uk-margin">{company}</div>
    <div class="uk-margin">{vatid}</div>
  </div>
  <div class="uk-margin">{recipient}</div>
  <div class="uk-margin">{country}</div>

  <div>{instant}</div>
  <div>{terms}</div>
</div>

<div
  id="htmx-modal"
  class="uk-modal-container"
  uk-modal
>
  <div class="uk-modal-dialog uk-modal-body uk-margin-auto-vertical">
    <button
      class="uk-modal-close-default"
      type="button"
      uk-close
    ></button>

    <div class="content"></div>
    <div class="loading uk-hidden">
      <div class="uk-flex uk-flex-center uk-section">
        <div uk-spinner></div>
      </div>
    </div>
  </div>
</div>

<script>
  function updatePrice() {
    let util = UIkit.util;
    let amount = util.$("input[name=amount]").value * 1;
    let $net = util.$("#price");
    let EUR = new Intl.NumberFormat("de-DE", {
      style: "currency",
      currency: "EUR",
    });
    let tax = 1;
    // let type = util.$("input[name=type]:checked").value;
    let type = util.$("[name=type]").value;
    if (type === "aut-company" || type === "eu-individual") {
      tax = 1.2;
      util.removeClass(util.$$(".tax"), "uk-hidden");
    } else {
      util.addClass(util.$$(".tax"), "uk-hidden");
    }
    let net = util.data($net, "price") * 1;
    // console.log(amount, $net, price, net);
    $net.innerText = EUR.format(net * amount);
    util.$("#gross").innerText = EUR.format(amount * net * tax);
  }
  updatePrice();

  // reset loading spinner for hx-modal
  UIkit.util.on("#htmx-modal", "beforeshow", function (e) {
    let util = UIkit.util;
    let $modal = e.target;
    util.$(".content", $modal).innerHTML = util.$(".loading", $modal).innerHTML;
  });

  // show loading overlay on form submit
  document.addEventListener("submit", function (e) {
    if (!Nette.validateForm(e.target)) return;
    document.getElementById("rf-loading").classList.add("show");
  });
</script>
<div id="rf-loading">
  <div>
    <div class="uk-text-bold">Submitting form ...</div>
    <div class="uk-flex uk-flex-center uk-margin-top">
      <span class="loader"></span>
    </div>
  </div>
</div>
<style>
  #rf-loading {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.7);
    z-index: 999999;
    justify-content: center;
    align-items: center;
    transition: all 0.3s ease-in-out;
    display: flex;
    opacity: 0;
    pointer-events: none;
  }
  #rf-loading.show {
    pointer-events: all;
    opacity: 1;
  }
  #rf-loading .loader {
    transform: rotateZ(45deg);
    perspective: 1000px;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    color: #000;
  }
  #rf-loading .loader:before,
  #rf-loading .loader:after {
    content: "";
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    width: inherit;
    height: inherit;
    border-radius: 50%;
    transform: rotateX(70deg);
    animation: 1s spin linear infinite;
  }
  #rf-loading .loader:after {
    color: #00bb86;
    transform: rotateY(70deg);
    animation-delay: 0.4s;
  }
  @keyframes rotate {
    0% {
      transform: translate(-50%, -50%) rotateZ(0deg);
    }
    100% {
      transform: translate(-50%, -50%) rotateZ(360deg);
    }
  }
  @keyframes rotateccw {
    0% {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    100% {
      transform: translate(-50%, -50%) rotate(-360deg);
    }
  }
  @keyframes spin {
    0%,
    100% {
      box-shadow: 0.2em 0px 0 0px currentcolor;
    }
    12% {
      box-shadow: 0.2em 0.2em 0 0 currentcolor;
    }
    25% {
      box-shadow: 0 0.2em 0 0px currentcolor;
    }
    37% {
      box-shadow: -0.2em 0.2em 0 0 currentcolor;
    }
    50% {
      box-shadow: -0.2em 0 0 0 currentcolor;
    }
    62% {
      box-shadow: -0.2em -0.2em 0 0 currentcolor;
    }
    75% {
      box-shadow: 0px -0.2em 0 0 currentcolor;
    }
    87% {
      box-shadow: 0.2em -0.2em 0 0 currentcolor;
    }
  }
</style>

<style>
  .loader {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: inline-block;
    position: relative;
    border: 3px solid;
    border-color: #666 #666 transparent;
    box-sizing: border-box;
    animation: rotation 1s linear infinite;
  }
  .loader::after {
    content: "";
    box-sizing: border-box;
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    margin: auto;
    border: 3px solid;
    border-color: transparent #00bb86 #00bb86;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    animation: rotationBack 0.5s linear infinite;
    transform-origin: center center;
  }

  @keyframes rotation {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }

  @keyframes rotationBack {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(-360deg);
    }
  }
</style>
<div>
  <h3 class="uk-heading-line uk-text-center"><span>Your Order</span></h3>
  <table
    class="uk-table uk-table-responsive uk-table-middle uk-table-small uk-table-striped"
  >
    <tr>
      <th>Amount</th>
      <th>Description</th>
      <th class="uk-text-right@m">Price</th>
    </tr>
    <tr>
      <td>{amount}</td>
      <td class="uk-width-expand">
        {subject}
        <div class="uk-text-small uk-text-muted">
          <a href="{back}#pricing">Change Plan</a>
        </div>
      </td>
      <td class="uk-text-nowrap">
        <span
          data-price="{price}"
          id="price"
        >
          {price},00 €
        </span>
      </td>
    </tr>
  </table>

  <h3 class="uk-heading-line uk-text-center"><span>Details</span></h3>
  <div class="uk-margin">{email}</div>
  <div class="uk-margin">{type}</div>
  <div
    class="person"
    hidden
  >
    <div class="uk-margin">{forename}</div>
    <div class="uk-margin">{surname}</div>
  </div>
  <div class="company">
    <div class="uk-margin">{company}</div>
    <div class="uk-margin">{vatid}</div>
  </div>
  <div class="uk-margin">{recipient}</div>
  <div class="uk-margin">{instant}</div>
</div>
